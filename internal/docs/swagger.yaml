      produces:
      - application/json
      responses:
        "200":
          description: 查询成功
          schema:
            $ref: '#/definitions/response.ActionResultPage'
      summary: 查询
      tags:
      - AppSecret
  /app-secret/update:
    put:
      consumes:
      - application/json
      parameters:
      - description: CreateAndUpdateAppSecretRequest object
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/appsecret.CreateAndUpdateAppSecretRequest'
      produces:
      - application/json
      responses:
        "204":
          description: 编辑成功
          schema:
            $ref: '#/definitions/response.ActionResult'
      summary: 编辑
      tags:
      - AppSecret
  /auth/captcha:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Captcha'
      summary: 生成验证码
      tags:
      - Auth
  /auth/info:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: 获取用户信息
      tags:
      - Auth
  /auth/login:
    post:
      parameters:
      - description: 用户名, 密码, 验证码
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/request.LoginAuthUser'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: 用户登录
      tags:
      - Auth
  /auth/logout:
    delete:
      parameters:
      - description: 刷新凭证
        in: body
        name: data
        schema:
          $ref: '#/definitions/request.RefreshToken'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.ActionResult'
      summary: 用户登出
      tags:
      - Auth
  /auth/refresh-token:
    post:
      parameters:
      - description: token值
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/request.RefreshToken'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.JwtToken'
      summary: 刷新Token，以旧换新
      tags:
      - Auth
  /auth/reset-email-code:
    post:
      parameters:
      - description: 邮箱地址
        in: body
        name: data
        required: true
        schema:
