info:
  contact: {}
paths:
  /app-secret/create:
    post:
      consumes:
      - application/json
      parameters:
      - description: CreateAndUpdateAppSecretRequest object
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/appsecret.CreateAndUpdateAppSecretRequest'
      produces:
      - application/json
      responses:
        "201":
          description: 创建成功
          schema:
            $ref: '#/definitions/response.ActionResult'
      summary: 创建
      tags:
      - AppSecret
  /app-secret/delete:
    delete:
      consumes:
      - application/json
      parameters:
      - description: ID数组
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.IdCollection'
      produces:
      - application/json
      responses:
        "200":
          description: 删除成功
          schema:
            $ref: '#/definitions/response.ActionResult'
      summary: 删除
      tags:
      - AppSecret
  /app-secret/download:
    post:
      consumes:
      - application/json
      parameters:
      - description: AppSecret request object
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/appsecret.QueryAppSecretRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 查询成功
          schema:
            $ref: '#/definitions/response.ActionResultPage'
      summary: 导出
      tags:
      - AppSecret
  /app-secret/get-list:
    get:
      consumes:
      - application/json
      parameters:
      - description: AppSecret request object
        in: body
        name: request
        required: true
        schema:
