system:
  env: public
  is-init-table: true
  is-init-table-data: true
  main-database: sqlite
  oss-type: local
  file-limit-size: 10
  router-prefix: "api"
  port: 9002
  use-redis: false
  is-quick-debug: true
  user-default-password: "123456"
data-connection:
  connections:
    sqlite:
      enabled: true
      db-type: sqlite
      host: ./data
      db-name: ape-volo-admin-main
      log-mode: error
      max-idle-conns: 1
      max-open-conns: 1
    mysql:
      enabled: false
      db-type: mysql
      host: 127.0.0.1
      port: "3306"
      db-name: ape_volo_admin_main
      username: ""
      password: ""
      config: charset=utf8mb4&parseTime=true&loc=Asia%2FShanghai
      engine: InnoDB
      max-idle-conns: 5
      max-open-conns: 20
    mssql:
      enabled: false
      db-type: mssql
      host: 127.0.0.1
      port: "1433"
      db-name: ape_volo_admin_main
      username: ""
      password: ""
      config: encrypt=disable
      max-idle-conns: 5
      max-open-conns: 20
    pgsql:
      enabled: false
      db-type: pgsql
      host: 127.0.0.1
      port: "5432"
      db-name: ape_volo_admin_main
      username: ""
      password: ""
      config: sslmode=disable TimeZone=Asia/Shanghai
      max-idle-conns: 5
      max-open-conns: 20
    oracle:
      enabled: false
      db-type: oracle
      host: 127.0.0.1
      port: "1521"
      db-name: FREEPDB1
      username: ""
      password: ""
      config: ""
      max-idle-conns: 5
      max-open-conns: 20
log-data-connection:
  enabled: true
  db-type: sqlite
  host: ./data
  db-name: ape-volo-admin-log
  log-mode: silent
  max-idle-conns: 1
  max-open-conns: 1
redis:
  addr: 127.0.0.1:6379
  password: ""
  db: 0
cors:
  mode: whitelist # strict-whitelist
  whitelist:
    - allow-origin: http://localhost:9001
      allow-methods: POST, GET, Options
      allow-headers: Content-Type,AccessToken,X-CSRF-Token, Authorization, Token,X-Token,X-User-Id
      expose-headers: Content-Length, Access-Control-Allow-Origin, Access-Control-Allow-Headers, Content-Type, X-Request-ID
      allow-credentials: true
    - allow-origin: http://127.0.0.1:9001
      allow-methods: GET, POST, Options
      allow-headers: content-type
      expose-headers: Content-Length, Access-Control-Allow-Origin, Access-Control-Allow-Headers, Content-Type, X-Request-ID
      allow-credentials: true
zap:
  level: info
  prefix: "[Ape-Volo]"
  format: console
  director: logs
  encode-level: LowercaseColorLevelEncoder
  stacktrace-key: stacktrace
  max-age: 0
  max-size: 100 # 单个日志文件上限(MB)，0 表示不限制
  show-line: true
  log-in-console: true
log-storage:
  time-zone: Asia/Shanghai
log-queue:
  capacity: 10000
  batch-size: 200
  write-timeout-seconds: 5
  shutdown-timeout-seconds: 30
swagger:
  enabled: true
  name: v1
  version: "3.6.2.2"
  title: "Ape-Volo-Admin-Go 接口文档"
  contact-name: xianhc
  contact-email: apevolo@gamil.com
  contact-url: https://www.apevolo.com
jwt-auth-options:
  "audience": "https://www.apevolo.com"
  "issuer": "https://www.apevolo.com"
  "security_key": "tnEFrisgC9t5LDC8zShmUqHf+6iSoP0NzjJBxXrC87dz45PNrjEKXv1vbsJpMg9H"
  "access_token_lifetime_ms": 900000
  "refresh_token_lifetime_ms": 604800000
  "login_path": "/auth/login"
rsa:
  PrivateKeyPath: resource/keys/password-private.pem
login-failed-limit:
  enabled: true
  max_attempts: 3
  lockout: 7200
captcha:
  code-length: 6
  image-width: 240
  image-height: 80
  font-size: 48
  failure-threshold: 0
  counter-ttl-seconds: 3600
aop:
  transactions: true
  cache: true
excel:
  dir: ./resource/exportFile/
local:
  path: /uploads/file
  store-path: uploads/file
